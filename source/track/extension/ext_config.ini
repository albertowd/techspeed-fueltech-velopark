local ORANGE, TEAL, WHITE = rgbm(1, .5, 0, 1), rgbm(.16, .78, .7, 1), rgbm(.94, .94, .94, 1)
local L = vec2(10, 18)
local scroll = 0
local function fmt(ms) return string.format("%d:%06.3f", math.floor(ms / 60000), (ms % 60000) / 1000) end
local function put(x, y, t, c, right) if right then x = x - #t * L.x end display.text{ pos = vec2(x, y), letter = L, text = t, font = "aria", color = c } end
function update(dt)
	display.rect{ pos = vec2(0, 0), size = vec2(1024, 64), color = rgbm(.13, .13, .13, 1) }
	display.text{ pos = vec2(60, 18), letter = vec2(15, 28), text = "HotLap", font = "aria", color = WHITE }
	display.text{ pos = vec2(512 - 13 * 11, 84), letter = vec2(22, 38), text = "Classificacao", font = "aria", color = ORANGE }
	display.rect{ pos = vec2(16, TOP - ROW), size = vec2(992, ROW), color = rgbm(.12, .12, .12, 1) }
	for i, h in ipairs({ "#", "Marca", "Modelo", "Ano", "Piloto(a)", "Tempo", "Edicao" }) do put(X[i], TOP - ROW + 6, h, WHITE, i == 6) end
	local best = 0
	local ok, car = pcall(ac.getCar, 0)
	if ok and car and car.bestLapTimeMs and car.bestLapTimeMs > 0 then best = car.bestLapTimeMs end
	local you = nil
	if best > 0 then you = #R + 1 for i = 1, #R do if R[i][6] > best then you = i break end end end
	local n = #R + (you and 1 or 0)
	if you then
		local target = math.max(0, math.min(n - SHOW, you - 1 - math.floor(SHOW / 2)))
		scroll = scroll + (target - scroll) * math.min(1, dt * 2)
	else
		scroll = (scroll + dt * .7) % n
	end
	local first = math.floor(scroll)
	for j = 0, SHOW - 1 do
		local p = (first + j) % n + 1
		local y = TOP + j * ROW
		if you and p == you then
			display.rect{ pos = vec2(16, y), size = vec2(992, ROW - 1), color = rgbm(1, .5, 0, .35) }
			put(X[1], y + 6, tostring(you), WHITE) put(X[5], y + 6, "@ VOCE", WHITE) put(X[6], y + 6, fmt(best), WHITE, true)
		else
			local r = R[(you and p > you) and p - 1 or p]
			local c = r[1] <= 3 and ORANGE or TEAL
			display.rect{ pos = vec2(16, y), size = vec2(992, ROW - 1), color = rgbm(.12, .12, .12, 1) }
			put(X[1], y + 6, tostring(r[1]), c) put(X[2], y + 6, r[2], c) put(X[3], y + 6, r[3], c) put(X[4], y + 6, r[4], c)
			put(X[5], y + 6, "@ " .. r[5], c) put(X[6], y + 6, fmt(r[6]), c, true) put(X[7], y + 6, r[7] .. ".", WHITE)
		end
	end
end'
BACKGROUND = 0.07, 0.07, 0.07, 1
; (the end of the HotLap Velopark site's times)

; The session's times on the TV in the open end of the building by the hotlap's pit lane, drawn
; by this script, written by tools/build_outside.py. Without the patch the TV shows them painted.
[SCRIPTABLE_DISPLAY_...]
MATERIALS = OutTiming
RESOLUTION = 1024, 576
DISPLAY_POS = 0, 0
DISPLAY_SIZE = 1024, 576
SCRIPT = '
-- the session: every car in order of its best lap, from tools/build_outside.py
local WHITE, GREY, GREEN, AMBER = rgbm(.95, .95, .95, 1), rgbm(.7, .7, .74, 1), rgbm(.45, .86, .45, 1), rgbm(.92, .78, .24, 1)
local L, S = vec2(11, 20), vec2(8, 14)
local function get(o, k) local ok, v = pcall(function() return o[k] end) if ok then return v end return nil end
local function fmt(ms) if not ms or ms <= 0 then return "--:--.---" end return string.format("%02d:%06.3f", math.floor(ms / 60000), (ms % 60000) / 1000) end
local function clock(s) s = math.max(0, math.floor(s or 0)) return string.format("%02d:%02d:%02d", math.floor(s / 3600), math.floor(s / 60) % 60, s % 60) end
local function put(x, y, t, c, l) display.text{ pos = vec2(x, y), letter = l or S, text = t, font = "aria", color = c } end
function update(dt)
	local ok, sim = pcall(ac.getSim)
	if not ok or not sim then return end
	local n = get(sim, "carsCount") or 1
	local rows = {}
	for i = 0, n - 1 do
		local okc, car = pcall(ac.getCar, i)
		if okc and car then
			local okn, name = pcall(ac.getDriverName, i)
			rows[#rows + 1] = { name = okn and name or ("CAR " .. (i + 1)), best = get(car, "bestLapTimeMs") or 0,
				last = get(car, "previousLapTimeMs") or 0, laps = get(car, "lapCount") or 0 }
		end
	end
	table.sort(rows, function(a, b) if (a.best > 0) ~= (b.best > 0) then return a.best > 0 end return a.best < b.best end)
	local left = get(sim, "sessionTimeLeft")
	put(24, 16, "Session:", GREY) put(110, 16, "HOT LAP", WHITE)
	put(24, 40, "Timing:", GREY) put(110, 34, clock((get(sim, "timeHours") or 0) * 3600 + (get(sim, "timeMinutes") or 0) * 60 + (get(sim, "timeSeconds") or 0)), WHITE, vec2(15, 28))
	put(24, 68, "Time to go:", GREY) put(130, 68, clock(left and left / 1000 or 0), WHITE)
	display.rect{ pos = vec2(20, 92), size = vec2(984, 2), color = rgbm(.86, .86, .88, 1) }
	local fastest = rows[1] and rows[1].best or 0
	for k = 1, math.min(#rows, 13) do
		local r, y = rows[k], 100 + (k - 1) * 33
		put(24, y + 4, tostring(k), WHITE, L)
		put(70, y, string.upper(r.name), WHITE, L)
		put(70, y + 20, "Laps: " .. r.laps, GREY, vec2(6, 11))
		put(400, y + 6, "Last Time: " .. fmt(r.last), GREY)
		put(600, y + 6, "Best Time: " .. fmt(r.best), k == 1 and r.best > 0 and GREEN or WHITE)
		if k > 1 and r.best > 0 and fastest > 0 then put(820, y + 6, string.format("Diff: %.3f", (r.best - fastest) / 1000), GREY) end
		display.rect{ pos = vec2(20, y + 32), size = vec2(984, 1), color = rgbm(.35, .36, .4, 1) }
	end
	put(24, 554, "Timing and results are not official", AMBER, vec2(7, 12))
end'
BACKGROUND = 0.04, 0.05, 0.07, 1
; (the end of the session's times)

; ---- Start gantry board --------------------------------------------------
; Live leaderboard on both faces: first to fourth on the left, fifth and sixth in the
; middle with the race time or time of day below them, seventh to tenth on the right.
; Each row is position, kart number and lap time. Without the patch the board
; stays as its plain artwork.
[SCRIPTABLE_DISPLAY_...]
MATERIALS = GantryBoard
RESOLUTION = 2048, 320
DISPLAY_POS = 306, 8
DISPLAY_SIZE = 1436, 304
SCRIPT = '
local order, timer = {}, 1
local flagLamps = ac.findMeshes("GANTRY_FLAG")
local flagTime, flagState, flagShown = 0, "", nil
local GREEN, YELLOW, RED, OFF = rgb(0, 24, 3), rgb(26, 17, 0), rgb(28, 0, 0), rgb(0, 0, 0)

local function setFlag(state, colour)
	if state ~= flagState then
		flagState = state
		flagLamps:setMaterialProperty("ksEmissive", colour)
	end
end

local function updateFlag(sim, dt)
	flagTime = flagTime + dt
	local waiting = sim.raceSessionType == 3 and sim.timeToSessionStart > 0
	if flagShown ~= (not waiting) then
		flagShown = not waiting
		flagLamps:setVisible(flagShown)
	end
	local f = sim.raceFlagType
	if f == ac.FlagType.Stop or f == ac.FlagType.SessionSuspended then
		setFlag("red", RED)
	elseif f == ac.FlagType.Caution then
		if flagTime % 1 < .5 then setFlag("yellow", YELLOW) else setFlag("off", OFF) end
	else
		setFlag("green", GREEN)
	end
end

local function lapText(ms)
	if ms <= 0 then return "" end
	local s = ms / 1000
	return string.format("%d:%06.3f", math.floor(s / 60), s % 60)
end

local function clockText(ms)
	local s = math.max(math.floor(ms / 1000), 0)
	return string.format("%d:%02d", math.floor(s / 60), s % 60)
end

local function refresh()
	local sim = ac.getSim()
	local list = {}
	for i = 0, sim.carsCount - 1 do
		local c = ac.getCar(i)
		if c ~= nil then
			list[#list + 1] = c
		end
	end
	table.sort(list, function(a, b) return a.racePosition < b.racePosition end)
	order = list
end

local function row(x, y, pos, letter)
	local c = order[pos]
	if c == nil then return end
	local col = rgbm(1, .06, .04, 1)
	local ms = c.previousLapTimeMs > 0 and c.previousLapTimeMs or c.bestLapTimeMs
	display.text{ pos = vec2(x, y), letter = letter, text = tostring(pos), font = "digital_big", color = col }
	display.text{ pos = vec2(x + letter.x * 2.2, y), letter = letter, text = tostring(ac.getDriverNumber(c.index)), font = "digital_big", color = col }
	display.text{ pos = vec2(x + letter.x * 5.2, y), letter = letter, text = lapText(ms), font = "digital_big", color = col }
end

function update(dt)
	timer = timer + dt
	if timer > .5 then
		timer = 0
		refresh()
	end
	local sim = ac.getSim()
	updateFlag(sim, dt)
	local letter = vec2(30, 60)
	for i = 0, 3 do
		row(10, 8 + i * 74, 1 + i, letter)
		row(968, 8 + i * 74, 7 + i, letter)
	end
	row(490, 8, 5, letter)
	row(490, 82, 6, letter)
	local race = sim.raceSessionType == 3
	local ms = math.max(sim.currentSessionTime, 0)
	display.text{ pos = vec2(609, 146), letter = vec2(48, 88), text = race and clockText(ms) or string.format("%02d:%02d", math.floor(sim.timeHours) % 24, math.floor(sim.timeMinutes) % 60), font = "digital_big", color = rgbm(1, .06, .04, 1) }
end'
BACKGROUND = 0, 0, 0, 1

