ROUGH_MATERIALS = Background, BackgroundFar, BROAD ?, ASH ?, TyreBarrier

; ---- Night lights --------------------------------------------------------
; One beam from the lamp head of each of the 25 poles, 17 m up. The beam lands where the
; old 8 m poles aimed it, and it is bright enough that no part of the road is darker
; than with the old poles. It is wide enough to reach the road on both sides of the pole, plus a
; faint spill straight down. Brightness is the last number of COLOR. Most of the road is
; 25-40 m from a pole, so the light holds to half its range before fading and
; ignores most of the grazing angle (low DIFFUSE_CONCENTRATION).
[LIGHT_SERIES_0]
