; Techspeed FuelTech Velopark 0.7.1 - Custom Shaders Patch configuration
[ABOUT]
AUTHOR = Alberto Wollmann Dietrich
VERSION = 0.7.1
DATE_RELEASE = 11 November 2026

[INCLUDE]
INCLUDE = common/conditions.ini, common/materials_track.ini, common/custom_emissive.ini

[BASIC]
; replaces the generic online preset, written for another track with the same folder name
IGNORE_OTHER_CONFIGS = 1
SUPPORTS_WIND = 1

[LIGHTING]
LIT_MULT = 1
SPECULAR_MULT = 1
CAR_LIGHTS_LIT_MULT = 1
ENABLE_TREES_LIGHTING = 1

[BOUNCED_LIGHT]
SUPPORTED = 1

[LIGHT_POLLUTION]
ACTIVE = 1
COLOR = 1, 0.93, 0.82
DENSITY = 0.15
RADIUS_KM = 1

; ---- Grass ---------------------------------------------------------------
; Grows on the two ground meshes (the walls share their material, so meshes are
; listed rather than the material). The ground photo was recoloured so vegetation
; is clearly green and asphalt, dirt, roofs and water are not: the colour mask below
; is what keeps grass off everything that has no 3D mesh in the photo.
[GRASS_FX]
GRASS_MESHES = 1GRASS_0, 1GRASS_0_2, 1GRASS_0_3, 1GRASS_0_4, GRASS_1, 1GRASS_KERB_BED_T1_KINK, 1GRASS_KERB_BED_T2, 1GRASS_KERB_BED_T3, 1GRASS_KERB_FILL_S1_IN, 1GRASS_KERB_BED_STRAIGHT3, 1GRASS_KERB_BED_S2_RIGHT, 1GRASS_KERB_BED_T12, 1GRASS_KERB_BED_S2_1500, 1GRASS_KERB_BED_L1500_B, 1GRASS_KERB_BED_K1_T1, 1GRASS_KERB_BED_K1_T3, 1GRASS_KERB_BED_K1_S_RIGHT, 1GRASS_PATCH_STRAIGHT4_1GRASS_0, 1GRASS_PATCH_STRAIGHT5_1GRASS_0, 1GRASS_PATCH_LAST_OUT_1GRASS_0, 1GRASS_0_RUNOFF_K1_T3_EXIT, 1GRASS_RUNOFF_K1_T3_EXIT, 1GRASS_0_RUNOFF_K1_T4_EXIT, 1GRASS_RUNOFF_K1_T4_EXIT, 1GRASS_RUNOFF_K1_T3, 1GRASS_ISLAND_0_0, 1GRASS_ISLAND_0_1, 1GRASS_ISLAND_1_0, 1GRASS_WAS_PADDOCK_REST_K1_T3_EXIT, 1GRASS_WAS_PADDOCK_REST_K1_T4_EXIT, 1GRASS_WAS_PADDOCK_REST_K1_T3, 1GRASS_PADDOCK_LEFT_OVER, 1GRASS_PADDOCK_GRASS, 1GRASS_PADDOCK_WEST, 1GRASS_PADDOCK_HOTLAP, 1GRASS_PARK_ISLANDS, 1GRASS_PADDOCK_LANES_ISLAND
