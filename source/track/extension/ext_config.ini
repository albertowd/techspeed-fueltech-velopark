[MATERIAL_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Fuel station sign at night
MATERIALS = OutPylon
CONDITION = NIGHT_SMOOTH
KEY_0 = ksEmissive
VALUE_0 = 255, 255, 255, 0.5
VALUE_0_OFF = 0, 0, 0

; The fuel station's prices: lit digits as the start gantry's board has, drawn by this
; script, written by tools/build_outside.py from its FUEL_PRICES. Without the patch the
; sign shows them painted.
[SCRIPTABLE_DISPLAY_...]
MATERIALS = OutFuelPrices
RESOLUTION = 512, 1024
DISPLAY_POS = 0, 0
DISPLAY_SIZE = 512, 1024
SCRIPT = '
-- the prices, in reais: edit them here, or in FUEL_PRICES of tools/build_outside.py
local PRICES = { "4.55", "6.11" }
local RED = rgbm(1, .06, .04, 1)
local LETTER = vec2(104, 250)
function update(dt)
	for i, p in ipairs(PRICES) do
		display.text{ pos = vec2(482 - LETTER.x * #p, (i - 1) * 512 + 130), letter = LETTER, text = p, font = "digital_big", color = RED }
	end
end'
BACKGROUND = 0, 0, 0, 1

[CustomEmissive]
ACTIVE = 1
DESCRIPTION = Fuel station's prices
MATERIALS = OutFuelPrices
Resolution = 512, 1024
@ = CustomEmissive_Rect, Channel = 0, Start = "0, 0", Size = "512, 1024", CornerRadius = 0.0

[MATERIAL_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Fuel station's prices at night
MATERIALS = OutFuelPrices
CONDITION = NIGHT_SMOOTH
KEY_0 = ksEmissive
VALUE_0 = 255, 255, 255, 0.094
VALUE_0_OFF = 0, 0, 0
; (the end of the fuel station's prices)

