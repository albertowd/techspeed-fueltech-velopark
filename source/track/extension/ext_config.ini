; Techspeed FuelTech Velopark 0.8.1 - Custom Shaders Patch configuration
[ABOUT]
AUTHOR = Alberto Wollmann Dietrich
VERSION = 0.8.1
DATE_RELEASE = 28 November 2026

[INCLUDE]
INCLUDE = common/conditions.ini, common/materials_track.ini, common/custom_emissive.ini

[BASIC]
; replaces the generic online preset, written for another track with the same folder name
IGNORE_OTHER_CONFIGS = 1
SUPPORTS_WIND = 1

[LIGHTING]
LIT_MULT = 1
SPECULAR_MULT = 1
CAR_LIGHTS_LIT_MULT = 1
ENABLE_TREES_LIGHTING = 1

[BOUNCED_LIGHT]
SUPPORTED = 1

[LIGHT_POLLUTION]
ACTIVE = 1
COLOR = 1, 0.93, 0.82
DENSITY = 0.15
RADIUS_KM = 1

; ---- Grass ---------------------------------------------------------------
; Grows on the two ground meshes (the walls share their material, so meshes are
; listed rather than the material). The ground photo was recoloured so vegetation
; is clearly green and asphalt, dirt, roofs and water are not: the colour mask below
; is what keeps grass off everything that has no 3D mesh in the photo.
[GRASS_FX]
GRASS_MESHES = 
OCCLUDING_MATERIALS = 
ORIGINAL_GRASS_MATERIALS =
TRIM_PERIOD = THURSDAY
SHAPE_SIZE = 0.8, 1.5
SHAPE_TIDY = 1, 0.4
SHAPE_CUT = 0.5, 0
SHAPE_WIDTH = 1
MASK_MAIN_THRESHOLD = 0.08
MASK_RED_THRESHOLD = 0.02
MASK_MIN_LUMINANCE = 0.02
MASK_MAX_LUMINANCE = 1
MASK_BLUR = 1

; ---- Rain ----------------------------------------------------------------
[RAIN_FX]
PUDDLES_MATERIALS = Tarmac Dark, Tarmac Light, Pavers, Rumble1, KerbConcrete, KerbFloor, KerbRamp, KerbRound
SOAKING_MATERIALS = Tarmac Dark, Tarmac Light
SMOOTH_MATERIALS = PoleLens, PoleGlass, PoleMast, MarkerBoards, ConeOrange
ROUGH_MATERIALS = Background, BackgroundFar, BROAD ?, ASH ?, TyreBarrier
