; The lamp glass glows at night.
[MATERIAL_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Pole lamps at night
MATERIALS = PoleLens
CONDITION = NIGHT_SMOOTH
KEY_0 = ksEmissive
VALUE_0 = 255, 238, 210, 0.12
VALUE_0_OFF = 0, 0, 0

; Tarmac reflects about 40% of what the grass in the ground photo does (same ksDiffuse, darker
; texture), which left the road black beside lit grass. Daytime values are untouched. The
; concrete paving (Pavers) is left out: its texture is twice as light as the tarmac's.
[MATERIAL_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Road response at night
MATERIALS = Tarmac Dark, Tarmac Light, Rumble1, KerbConcrete, KerbFloor, KerbRamp, KerbRound, Pit01c2
CONDITION = NIGHT_SMOOTH
KEY_0 = ksDiffuse
VALUE_0 = 0.45
VALUE_0_OFF = 0.2
KEY_1 = ksAmbient
VALUE_1 = 0.3
VALUE_1_OFF = 0.2

; The paddock buildings reflect three times what the road does by day (ksDiffuse 0.6, a
; light wall texture) and stand right under the paddock wash lights, so at night they
; glowed brighter than anything else. They have no lights of their own. At night they
; take about the road's response, less for the light walls. Daytime values are untouched.
[MATERIAL_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Buildings at night
MATERIALS = BuildingWall, BuildingRoof, BuildingSolar, BuildingDoor, BuildingDark
CONDITION = NIGHT_SMOOTH
KEY_0 = ksDiffuse
VALUE_0 = 0.25
VALUE_0_OFF = 0.6
KEY_1 = ksAmbient
VALUE_1 = 0.15
VALUE_1_OFF = 0.3

; The ceiling lamps in the middle's buildings glow at night, seen through their windows
; (their light is LIGHT_SERIES_3).
[MATERIAL_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Building lamps at night
MATERIALS = OutLamp
CONDITION = NIGHT_SMOOTH
KEY_0 = ksEmissive
VALUE_0 = 255, 226, 180, 0.6
VALUE_0_OFF = 0, 0, 0

; The fuel station's sign is lit from inside at night, as the stations' signs are: its
