DESCRIPTION = Gantry board LEDs at night
MATERIALS = GantryBoard
CONDITION = NIGHT_SMOOTH
KEY_0 = ksEmissive
VALUE_0 = 255, 255, 255, 0.094
VALUE_0_OFF = 0, 0, 0
