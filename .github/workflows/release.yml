name: Release

# Push a tag like v0.5.1 to build velopark-0.5.1.7z for Assetto Corsa (for overtake.gg) and
# velopark-beamng-0.5.1.zip for BeamNG.drive, and attach both to a GitHub release, with that
# version's CHANGELOG section as the release notes.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check the version
        id: version
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          track=content/tracks/techspeed_velopark
          grep -q "^VERSION = $version\$" "$track/extension/ext_config.ini" \
            || { echo "ext_config.ini is not at $version: run release.ps1 -Version $version first"; exit 1; }
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' "$track/CHANGELOG.md" > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the archive
        run: |
          set -e
          archive="velopark-${{ steps.version.outputs.version }}.7z"
          7z a -t7z -mx=9 "$archive" content > /dev/null
          7z t "$archive" > /dev/null
          ls -la "$archive"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build the BeamNG archive
        run: |
          set -e
          pip install numpy pillow
          python tools/export_beamng.py
          mv "build/velopark-beamng-${{ steps.version.outputs.version }}.zip" .
          ls -la "velopark-beamng-${{ steps.version.outputs.version }}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          name: Techspeed Velopark ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            velopark-${{ steps.version.outputs.version }}.7z
            velopark-beamng-${{ steps.version.outputs.version }}.zip
