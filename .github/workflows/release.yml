name: Release

# Push a tag like v0.6.1 to build techspeed_fueltech_velopark_ac.7z for Assetto Corsa (for overtake.gg) and
# techspeed_fueltech_velopark_beamng.zip for BeamNG.drive from the track's sources, and attach both to a
# GitHub release, with that version's CHANGELOG section as the release notes.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check the version
        id: version
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          track=source/track
          grep -q "^VERSION = $version\$" "$track/extension/ext_config.ini" \
            || { echo "ext_config.ini is not at $version: run release.ps1 -Version $version first"; exit 1; }
          # the section of this version, its lines without any Windows line ends
          awk -v v="## $version" '{sub(/\r$/, "")} $0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build both games
        run: |
          set -e
          # all but bpy, which only the preview renders use
          grep -v '^bpy' tools/requirements.txt > requirements-build.txt
          pip install -r requirements-build.txt
          python tools/build_tracks.py ac beamng --all --pack

      - name: Pack the archives
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          archive="$PWD/techspeed_fueltech_velopark_ac.7z"
          (cd build/ac && 7z a -t7z -mx=9 "$archive" content > /dev/null)
          7z t "$archive" > /dev/null
          mv "build/dist/techspeed_fueltech_velopark_beamng.zip" .
          ls -la "techspeed_fueltech_velopark_ac.7z" "techspeed_fueltech_velopark_beamng.zip"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            techspeed_fueltech_velopark_ac.7z
            techspeed_fueltech_velopark_beamng.zip
